[package]
name = "sleepers-researcher"
version = "0.1.0"
description = "Local-first desktop AI research & dev agent"
authors = ["Sleepers"]
edition = "2021"
default-run = "sleepers-researcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
pdf-extract = "0.7"
printpdf = "0.7"

[profile.release]
opt-level = "s"
lto = true
strip = true
